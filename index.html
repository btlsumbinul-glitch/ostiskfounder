<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ostisk ফাউন্ডার কনসোল</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF7F2;--card:#FFFDF9;--line:#E7DFD2;--ink:#1B1A17;--txt:#4A4740;--mute:#857E72;--acc:#C2410C;--acc2:#FCEFE6;--ok:#2F7D4F;--okb:#E5F3EA;--warn:#B7791F;--warnb:#FBF1DC;--bad:#B42318;--badb:#FBE6E4;--blue:#2B5C8A;--blueb:#E6EEF6;--vio:#6B4FA0;--viob:#EFEAF7}
*{box-sizing:border-box;margin:0}
body{font-family:'Hind Siliguri',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--ink);color:#FAF7F2;padding:14px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:28px;height:28px;border-radius:8px;background:#F28B4B}
header h1{font-size:18px;font-weight:600}
header .sub{color:#B9B2A6;font-size:13px}
.hr{margin-left:auto;display:flex;gap:12px;align-items:center}
.who{font-size:13px;color:#D9D2C5}
.lang{display:inline-flex;background:#2E2C28;border-radius:8px;padding:2px}
.lang button{border:0;background:none;color:#B9B2A6;padding:3px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.lang button.on{background:#FAF7F2;color:var(--ink);font-weight:600}
nav{display:flex;gap:4px;padding:0 16px;background:var(--ink);overflow-x:auto}
nav a{color:#D9D2C5;text-decoration:none;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:500;white-space:nowrap}
nav a.on{background:var(--bg);color:var(--ink);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
.banner{background:var(--warnb);color:#7A4E0E;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:none}
.banner.info{background:var(--blueb);color:#1F4366}
.banner button{margin-left:8px;border:1px solid currentColor;background:transparent;color:inherit;border-radius:7px;padding:1px 10px;cursor:pointer;font-size:13px}
.xl{display:inline-flex;gap:6px;align-items:center}
.xl button,.xl label{border:1px solid #4A463F;background:#2E2C28;color:#F3EEE6;border-radius:8px;padding:3px 10px;cursor:pointer;font-size:13px;white-space:nowrap}
.xl button:hover,.xl label:hover{background:#3A3732}
.xl input[type=file]{display:none}
.mode{font-size:11.5px;padding:1px 8px;border-radius:20px;background:#3A3732;color:#D9D2C5;white-space:nowrap}
.mode.cloud{background:#24452F;color:#BFE3CB}
.who button{border:0;background:none;color:#F2B48A;cursor:pointer;text-decoration:underline;font-size:13px;padding:0}
.choice{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.choice label{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-size:14px}
.choice input{width:auto;margin-top:4px}
.sumtab{font-size:13.5px;margin-top:8px}
.sumtab td{padding:4px 10px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.row h2{font-size:20px;font-weight:600;margin-right:auto}
.seg{display:inline-flex;background:#EFE8DC;border-radius:10px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--txt)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{border:0;background:var(--acc);color:#fff;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi.link{cursor:pointer}.kpi.link:hover{border-color:#CDBFA9}
.kpi .l{color:var(--mute);font-size:13px}
.kpi .v{font-size:26px;font-weight:700;line-height:1.2;margin-top:2px}
.kpi .d{font-size:12.5px;color:var(--mute)}
.up{color:var(--ok)}.down{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:#CDBFA9}
.card h3{font-size:16px;font-weight:600;line-height:1.35}
.card .meta{font-size:13px;color:var(--mute);margin-top:6px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .note{font-size:13.5px;color:var(--txt);margin-top:6px;white-space:pre-wrap}
.bar{height:7px;background:#EFE8DC;border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:4px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:20px;white-space:nowrap}
.p-todo{background:#EFE8DC;color:var(--txt)}.p-doing{background:var(--blueb);color:var(--blue)}.p-done{background:var(--okb);color:var(--ok)}.p-risk{background:var(--badb);color:var(--bad)}.p-test{background:var(--warnb);color:var(--warn)}.p-vio{background:var(--viob);color:var(--vio)}
.p-high{background:var(--badb);color:var(--bad)}.p-med{background:var(--warnb);color:var(--warn)}.p-low{background:#EFE8DC;color:var(--txt)}
.group{margin-bottom:20px}
.group h4{font-size:14px;color:var(--mute);font-weight:600;margin-bottom:8px}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:#F2ECE2;border-radius:14px;padding:10px;min-height:200px}
.col h4{font-size:14px;font-weight:600;margin:2px 4px 10px;display:flex;justify-content:space-between}
.col .card{margin-bottom:8px;padding:10px 12px}
.mv{display:flex;gap:4px;margin-top:8px}
.mv button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:0 8px;cursor:pointer;font-size:13px}
table{width:100%;border-collapse:collapse;background:var(--card)}
th{text-align:left;font-size:13px;color:var(--mute);font-weight:600;padding:9px 12px;background:#F2ECE2;white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);font-size:14px;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#FBF7F0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:18px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.chart h4{font-size:14px;font-weight:600;margin-bottom:8px}
.empty{background:var(--card);border:1px dashed #D8CCB8;border-radius:14px;padding:28px;text-align:center;color:var(--mute)}
.sec-title{font-size:17px;font-weight:600;margin:26px 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-title .sp{margin-right:auto}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline input{width:150px}
input,select,textarea{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;width:100%}
textarea{min-height:70px;resize:vertical}
.feat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:start}
.feat h3{font-size:15.5px;font-weight:600;line-height:1.35}
.feat .ds{font-size:13.5px;color:var(--txt);margin-top:2px}
.feat .meta{font-size:12.5px;color:var(--mute);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.votes{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.votes button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:3px 9px;cursor:pointer;font-size:12.5px;white-space:nowrap}
.votes button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.votes button:disabled{opacity:.5;cursor:not-allowed}
.vlist{grid-column:1/-1;font-size:12.5px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.vchip{background:#F2ECE2;border-radius:6px;padding:1px 8px;color:var(--txt)}
.flist{display:flex;flex-direction:column;gap:8px}
.edit{border:0;background:none;color:var(--mute);cursor:pointer;font-size:12.5px;text-decoration:underline}
.swot{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.swot .q{border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:var(--card);min-height:150px}
.swot .q h4{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.swot .q li{margin:4px 0 4px 18px;font-size:14px;cursor:pointer}
.swot .q li:hover{text-decoration:underline}
.q.s{border-top:5px solid var(--ok)}.q.w{border-top:5px solid var(--bad)}.q.o{border-top:5px solid var(--blue)}.q.t{border-top:5px solid var(--warn)}
.mini{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:0 8px;cursor:pointer;font-size:13px}
#ov{position:fixed;inset:0;background:rgba(27,26,23,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 12px;overflow-y:auto;z-index:10}
#ov.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:560px;padding:20px}
.modal h3{font-size:18px;margin-bottom:12px}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fg .full{grid-column:1/-1}
.fg label{font-size:13px;color:var(--mute);display:block;margin-bottom:3px}
.mf{display:flex;gap:8px;margin-top:16px;align-items:center}
.mf .by{font-size:12px;color:var(--mute);margin-right:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;display:none;z-index:20}
@media(max-width:700px){.fg{grid-template-columns:1fr}.kpi .v{font-size:22px}.feat{grid-template-columns:1fr}.votes{justify-content:flex-start}.swot{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="logo"></div><div><h1 id="appTitle"></h1><div class="sub" id="appSub"></div></div><div class="hr"><span class="mode" id="mode"></span><div class="xl"><button id="xlOut" type="button"></button><label id="xlInL"><input type="file" id="xlIn" accept=".xlsx,.xls,.csv"><span id="xlInT"></span></label></div><div class="lang"><button data-lang="bn">বাংলা</button><button data-lang="en">English</button></div><div class="who" id="who"></div></div></header>
<nav id="nav"></nav>
<main><div class="banner" id="banner"></div><div id="view"></div></main>
<div id="ov"><div class="modal" id="modal"></div></div>
<div id="toast"></div>

function voteState(f){
 const v=Object.entries(f.votes||{}).filter(([k,x])=>x);
 if(!v.length)return{state:'none',votes:v};
 const vals=[...new Set(v.map(x=>x[1]))];
 const voters=Math.max(2,knownVoters().length);
 if(v.length<voters)return{state:'pending',votes:v,lean:vals.length===1?vals[0]:null};
 return vals.length===1?{state:'decided',votes:v,decision:vals[0]}:{state:'disagree',votes:v};
}
function knownVoters(){const s=new Set();S.features.forEach(f=>Object.entries(f.votes||{}).forEach(([k,x])=>{if(x)s.add(k)}));if(me)s.add(me);return[...s]}

 const inn=sum(x=>x.kind==='in'),out=sum(x=>x.kind!=='in');const cash=open+inn-out;const m=thisMonth();
 const mi=sum(x=>x.kind==='in'&&(x.date||'').startsWith(m)),mo=sum(x=>x.kind!=='in'&&(x.date||'').startsWith(m));
 const months={};S.txns.forEach(x=>{const k=(x.date||'').slice(0,7);if(k&&x.kind!=='in')months[k]=(months[k]||0)+(Number(x.amount)||0)});
 const mk=Object.keys(months).sort().slice(-3);const burn=mk.length?mk.reduce((a,k)=>a+months[k],0)/mk.length:0;

  else{const lg=a1-a0>Math.PI?1:0;const p=(rad,a)=>`${cx+rad*Math.cos(a)},${cy+rad*Math.sin(a)}`;

/* ---------- local (Excel) database: same API as the claude.ai db, kept in this browser ---------- */
const LS_KEY='ostisk-local-v1';
const newId=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
function emptyStore(){const c={};COLLS.forEach(k=>c[k]={});return{colls:c,docs:{},users:{},dirty:false,srcHash:null}}
function loadStore(){try{const s=JSON.parse(localStorage.getItem(LS_KEY)||'null');if(s&&s.colls){COLLS.forEach(k=>s.colls[k]=s.colls[k]||{});s.docs=s.docs||{};s.users=s.users||{};return s}}catch{}return emptyStore()}
const storeHasData=s=>COLLS.some(k=>Object.keys(s.colls[k]||{}).length)||Object.keys(s.docs||{}).length>0;
function makeLocalDb(store){
 const subs={};
 const persist=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(store))}catch{}};
 const isDoc=k=>k.includes('/');
 const snap=k=>isDoc(k)?{exists:k in store.docs,data:()=>clone(store.docs[k]||{}),metadata:{fromCache:false}}
  :{docs:Object.entries(store.colls[k]||{}).map(([id,o])=>({id,data:()=>clone(o)})),metadata:{fromCache:false}};
 const emit=k=>(subs[k]||[]).forEach(cb=>{try{cb(snap(k))}catch(e){console.error(e)}});
 const changed=k=>{store.dirty=true;persist();setTimeout(()=>emit(k),0)};
 const on=(k,cb)=>{(subs[k]=subs[k]||[]).push(cb);setTimeout(()=>cb(snap(k)),0);return()=>{subs[k]=subs[k].filter(x=>x!==cb)}};
 const merge=(a,b)=>{const o={...a};for(const[k,v]of Object.entries(b)){o[k]=(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object')?merge(a[k],v):v}return o};
 const docRef=(c,id)=>({id,
  set:async o=>{store.colls[c][id]=clone(o);changed(c)},
  update:async p=>{const cur=store.colls[c][id];if(!cur)throw{code:'not_found'};store.colls[c][id]=merge(cur,clone(p));changed(c)},
  delete:async()=>{delete store.colls[c][id];changed(c)}});
 return{local:true,get store(){return store},
  collection:c=>{store.colls[c]=store.colls[c]||{};return{doc:id=>docRef(c,id||newId()),onSnapshot:cb=>on(c,cb)}},
  doc:p=>({set:async o=>{store.docs[p]=clone(o);changed(p)},update:async q=>{store.docs[p]=merge(store.docs[p]||{},clone(q));changed(p)},onSnapshot:cb=>on(p,cb)}),
  load(D,{replace=true,dirty=false,srcHash=null}={}){
   if(replace){const e=emptyStore();store.colls=e.colls;store.docs={};store.users={}}
   for(const c of COLLS)if(D.colls[c])for(const o of D.colls[c]){const{id,...r}=o;store.colls[c][id]=r}
   if(D.targets)store.docs['targets/plan']={start:TG_START,months:replace?D.targets:{...(store.docs['targets/plan']?.months||{}),...D.targets}};
   if(D.settings)store.docs['settings/main']=replace?D.settings:{...(store.docs['settings/main']||{}),...D.settings};
   if(D.users)Object.assign(store.users,D.users);
   store.dirty=dirty;if(srcHash!==undefined)store.srcHash=srcHash;persist();
   [...COLLS,'settings/main','targets/plan'].forEach(emit)}
 };
}

const SCHEMA=Object.fromEntries(COLLS.map(c=>[c,['id',...FORMS[c].fields.map(f=>f.k),...(EXTRA[c]||[])]]));
const SHEET_LABEL={goals:'প্ল্যানিং — লক্ষ্য',dev:'ডেভেলপমেন্ট কাজ',metrics:'মাসিক বিজনেস ডেটা',txns:'লেনদেন (অ্যাকাউন্টস)',people:'টিম (এইচআর)',features:'ফিচার রোডম্যাপ ও ভোট',rmethods:'রিসার্চ পদ্ধতি',interviews:'ইন্টারভিউ ও সার্ভে',competitors:'প্রতিযোগী',sources:'ডেস্ক রিসার্চ ও সূত্র',swot:'SWOT',targets:'সেলস টার্গেট (মাসিক)',settings:'সেটিংস (শুরুর ক্যাশ)',users:'ভোটারদের নাম (আইডি → নাম)'};
function fieldType(c,k){if(k==='votes')return'json';const f=FORMS[c]?.fields.find(x=>x.k===k);return f?f.t:'text'}
let xlsxP=null;
function ensureXLSX(){
 if(window.XLSX)return Promise.resolve(window.XLSX);
 if(xlsxP)return xlsxP;
 const urls=['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'];
 xlsxP=(async()=>{for(const u of urls){try{await new Promise((ok,no)=>{const s=document.createElement('script');s.src=u;s.onload=ok;s.onerror=no;document.head.appendChild(s)});if(window.XLSX)return window.XLSX}catch{}}xlsxP=null;throw new Error('xlsx')})();
 return xlsxP;
}
const bnDigits=s=>String(s).replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d));
const serialToISO=v=>new Date(Math.round((v-25569)*864e5)).toISOString();
function cellVal(c,k,v){
 const tp=fieldType(c,k);
 if(v instanceof Date)v=v.toISOString();
 if(tp==='number'){if(v===''||v==null)return null;if(typeof v==='number')return v;const n=Number(bnDigits(v).replace(/[,\s৳]/g,''));return isNaN(n)?null:n}
 if(tp==='date'){if(typeof v==='number')return serialToISO(v).slice(0,10);return String(v??'').trim().slice(0,10)}
 if(tp==='month'){if(typeof v==='number')return serialToISO(v).slice(0,7);return String(v??'').trim().slice(0,7)}
 if(tp==='json'){if(!v)return{};try{const o=JSON.parse(v);return o&&typeof o==='object'?o:{}}catch{return{}}}
 return v==null?'':String(v);
}
function fromWorkbook(wb){
 const byName={};wb.SheetNames.forEach(n=>byName[n.trim().toLowerCase()]=wb.Sheets[n]);
 const rows=n=>byName[n]?XLSX.utils.sheet_to_json(byName[n],{defval:'',raw:true}).map(r=>{const o={};for(const[k,v]of Object.entries(r))o[String(k).trim()]=v;return o}).filter(r=>Object.values(r).some(v=>v!==''&&v!=null)):null;
 const D={colls:{},targets:null,settings:null,users:null};let found=0;
 for(const c of COLLS){const rs=rows(c.toLowerCase());if(!rs)continue;found++;
  D.colls[c]=rs.map(r=>{const o={};for(const[k,v]of Object.entries(r)){if(!k||k==='id'||k.startsWith('__EMPTY'))continue;if(TAIL.includes(k)){if(v!=='')o[k]=String(v);continue}o[k]=cellVal(c,k,v)}
   if(c==='features'&&!o.votes)o.votes={};
   let id=String(r.id??'').trim();if(c==='metrics'){if(!o.month)return null;id=o.month}if(!id)id=newId();return{id,...o}}).filter(Boolean)}
 const tr=rows('targets');if(tr){found++;D.targets={};tr.forEach(r=>{const m=cellVal('metrics','month',r.month);if(m)D.targets[m]={newPaid:cellVal('metrics','newPaid',r.newPaid),active:cellVal('metrics','active',r.active),mrr:cellVal('metrics','mrr',r.mrr)}})}
 const sr=rows('settings');if(sr){found++;D.settings={};sr.forEach(r=>{const k=String(r.key||'').trim();if(!k)return;const v=r.value;D.settings[k]=k==='openingCash'?(v===''?null:Number(bnDigits(v).replace(/[,\s৳]/g,''))||0):v})}
 const ur=rows('users');if(ur){D.users={};ur.forEach(r=>{if(r.id)D.users[String(r.id)]=String(r.name||'')})}
 if(!found)throw new Error('format');
 return D;
}
async function currentData(){
 const D={colls:{},targets:{...S.targets},settings:{...S.settings},users:{}};
 COLLS.forEach(c=>D.colls[c]=S[c].map(x=>clone(x)));
 const ids=new Set();COLLS.forEach(c=>S[c].forEach(x=>{if(x.updatedBy)ids.add(x.updatedBy);if(x.votes)Object.keys(x.votes).forEach(k=>ids.add(k))}));if(me)ids.add(me);
 if(user){const miss=[...ids].filter(i=>!(i in names));for(let i=0;i<miss.length;i+=60){try{const p=await user.profiles(miss.slice(i,i+60));miss.slice(i,i+60).forEach(k=>names[k]=p?.[k]?.name||'')}catch{}}}
 ids.forEach(i=>{if(names[i])D.users[i]=names[i]});
 delete D.settings.updatedAt;delete D.settings.updatedBy;
 return D;
}
function toWorkbook(D){
 const wb=XLSX.utils.book_new();
 const sheet=(name,aoa)=>{const ws=XLSX.utils.aoa_to_sheet(aoa);const w=(aoa[0]||[]).map((_,i)=>Math.max(10,Math.min(60,2+Math.max(...aoa.map(r=>String(r[i]??'').length)))));ws['!cols']=w.map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,ws,name)};
 const cnt={};const sheets=[];
 for(const c of COLLS){const list=D.colls[c]||[];const extra=[...new Set(list.flatMap(o=>Object.keys(o)))].filter(k=>!SCHEMA[c].includes(k)&&!TAIL.includes(k));
  const cols=[...SCHEMA[c],...extra,...TAIL];
  sheets.push([c,[cols,...list.map(o=>cols.map(k=>{const v=o[k];return v==null?'':typeof v==='object'?(Object.keys(v).length?JSON.stringify(v):''):v}))]]);cnt[c]=list.length}
 const tm=Object.keys(D.targets||{}).sort();sheets.push(['targets',[['month','newPaid','active','mrr'],...tm.map(m=>{const v=D.targets[m]||{};return[m,v.newPaid??'',v.active??'',v.mrr??'']})]]);cnt.targets=tm.length;
 sheets.push(['settings',[['key','value'],['openingCash',D.settings?.openingCash??'']]]);cnt.settings=1;
 const us=Object.entries(D.users||{});sheets.push(['users',[['id','name'],...us]]);cnt.users=us.length;
 sheet('README',[['Ostisk ফাউন্ডার কনসোল — ডেটা ফাইল'],[''],['এই ফাইলটি কনসোলের সব ডেটা। কনসোলের "এক্সেল আপলোড" বোতাম দিয়ে এটি আবার তোলা যায়।'],['নিয়ম: প্রতিটি শিটের প্রথম সারির কলামের নাম (ইংরেজি key) বদলাবেন না। নতুন সারি যোগ করতে পারেন — id ফাঁকা রাখলে নিজে থেকে তৈরি হবে।'],['GitHub-এ: index.html-এর পাশে এই ফাইলটি data.xlsx নামে রাখলে পেজ খুললেই ডেটা লোড হবে।'],[''],['শিট','কী আছে','সারি'],...Object.keys(cnt).map(k=>[k,SHEET_LABEL[k]||k,cnt[k]])]);
 sheets.forEach(([n,a])=>sheet(n,a));
 return wb;
}
async function exportXlsx(){
 const b=$('#xlOut');b.disabled=true;toast(t('xlLoading'));
 try{
  await ensureXLSX();const wb=toWorkbook(await currentData());
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});const name='data.xlsx';
  const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  let done=false;
  if(mode==='cloud'){try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:blob});done=true}}catch{}}
  if(!done){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
  toast(mode==='cloud'&&!done&&window.self!==window.top?t('dlBlocked'):t('dlDone'));
 }catch(e){toast(e?.message==='xlsx'?t('xlFail'):t('saveFail'))}
 finally{b.disabled=false}
}
async function handleFile(file){
 if(!file)return;
 if(mode==='cloud'&&!can()){toast(t('readOnlyToast'));return}
 let D;try{await ensureXLSX();const buf=await file.arrayBuffer();D=fromWorkbook(XLSX.read(buf,{type:'array'}))}catch(e){toast(e?.message==='xlsx'?t('xlFail'):t('impBad'));return}
 const rowsOf=k=>k==='targets'?Object.keys(D.targets||{}).length:k==='settings'?(D.settings?1:0):(D.colls[k]||[]).length;
 const keys=[...COLLS.filter(c=>D.colls[c]),...(D.targets?['targets']:[]),...(D.settings?['settings']:[])];
 const defMode=mode==='cloud'?'merge':'replace';
 $('#modal').innerHTML=`<h3>${t('impTitle')}</h3><div style="font-size:14px;color:var(--mute)">${esc(file.name)} · ${t('impFound')}</div>
  <table class="sumtab">${keys.map(k=>`<tr><td>${esc(SHEET_LABEL[k]||k)}</td><td class="num"><b>${nf(rowsOf(k))}</b> ${t('impRows')}</td></tr>`).join('')}</table>
  <div class="choice"><label><input type="radio" name="im" value="replace"${defMode==='replace'?' checked':''}><span><b>${t('impReplace')}</b><br><span style="color:var(--mute)">${t('impReplaceD')}</span></span></label>
  <label><input type="radio" name="im" value="merge"${defMode==='merge'?' checked':''}><span><b>${t('impMerge')}</b><br><span style="color:var(--mute)">${t('impMergeD')}</span></span></label></div>
  <div class="mf"><span class="by"></span><button type="button" class="btn ghost" id="cancel">${t('cancel')}</button><button type="button" class="btn" id="impGo">${t('impGo')}</button></div>`;
 $('#ov').classList.add('show');$('#cancel').onclick=closeForm;
 $('#impGo').onclick=async()=>{const replace=document.querySelector('[name=im]:checked').value==='replace';const b=$('#impGo');b.disabled=true;b.textContent=t('saving');
  try{await applyImport(D,replace);closeForm();toast(t('impDone'))}catch(e){handleErr(e);b.disabled=false;b.textContent=t('impGo')}};
}
async function applyImport(D,replace){
 if(D.users)Object.assign(names,D.users);
 if(mode==='local'){db.load(D,{replace,dirty:true,srcHash:undefined});if(bannerKey!=='localInfo')banner('localInfo');setupLocalMe();return}
 const jobs=[];
 for(const c of COLLS){if(!D.colls[c])continue;const keep=new Set(D.colls[c].map(o=>o.id));
  if(replace)S[c].forEach(x=>{if(!keep.has(x.id))jobs.push(()=>db.collection(c).doc(x.id).delete())});
  D.colls[c].forEach(o=>{const{id,...r}=o;jobs.push(()=>db.collection(c).doc(id).set(r))})}
 if(D.targets)jobs.push(()=>db.doc('targets/plan').set(stamp({start:TG_START,months:replace?D.targets:{...S.targets,...D.targets}})));
 if(D.settings)jobs.push(()=>db.doc('settings/main').set(stamp(replace?D.settings:{...S.settings,...D.settings})));
 for(let i=0;i<jobs.length;i+=15)await Promise.all(jobs.slice(i,i+15).map(f=>f()));
}
const fnv=buf=>{const a=new Uint8Array(buf);let h=2166136261;for(let i=0;i<a.length;i++){h^=a[i];h=Math.imul(h,16777619)}return(h>>>0).toString(16)+'-'+a.length};
async function loadServerXlsx(force){
 if(mode!=='local'||!/^https?:$/.test(location.protocol))return false;
 try{
  const r=await fetch('data.xlsx',{cache:'no-store'});if(!r.ok)return false;
  const buf=await r.arrayBuffer();const h=fnv(buf);const st=db.store;
  if(!force){if(st.dirty&&storeHasData(st)){if(h!==st.srcHash)banner('localDirty');return true}
   if(h===st.srcHash&&storeHasData(st))return true}
  await ensureXLSX();const D=fromWorkbook(XLSX.read(buf,{type:'array'}));
  if(D.users)Object.assign(names,D.users);
  db.load(D,{replace:true,dirty:false,srcHash:h});banner('localInfo');setupLocalMe();return true;
 }catch{return false}
}
/* who am I in Excel mode: a name kept in this browser (matches a name in the users sheet when possible) */
function setupLocalMe(){
 if(mode!=='local')return;let n='';try{n=localStorage.getItem('ostisk-me')||''}catch{}
 if(!n){me=null;render();return}
 const hit=Object.entries(db.store.users||{}).find(([,v])=>v&&v.trim().toLowerCase()===n.trim().toLowerCase());
 me=hit?hit[0]:'local:'+n.trim();names[me]=n.trim();
 if(!db.store.users[me]){db.store.users[me]=n.trim();try{localStorage.setItem(LS_KEY,JSON.stringify(db.store))}catch{}}
 render();
}
function askName(){
 let cur='';try{cur=localStorage.getItem('ostisk-me')||''}catch{}
 $('#modal').innerHTML=`<h3>${t('nameQ')}</h3><form id="nf"><label style="font-size:13px;color:var(--mute)">${t('yourName')}</label><input id="nmIn" value="${esc(cur)}" required><div class="mf"><span class="by"></span><button type="button" class="btn ghost" id="cancel">${t('cancel')}</button><button class="btn">${t('ok')}</button></div></form>`;
 $('#ov').classList.add('show');$('#cancel').onclick=closeForm;$('#nmIn').focus();
 $('#nf').onsubmit=e=>{e.preventDefault();const v=$('#nmIn').value.trim();if(!v)return;try{localStorage.setItem('ostisk-me',v)}catch{}closeForm();setupLocalMe()};
}
function renderChrome(){
 const m=$('#mode');m.textContent=mode==='cloud'?t('modeCloud'):mode==='local'?t('modeLocal'):'';m.className='mode'+(mode==='cloud'?' cloud':'');m.style.display=mode?'':'none';
 $('#xlOut').textContent=t('xlOut');$('#xlInT').textContent=t('xlIn');
 if(mode==='local'){const w=$('#who');w.innerHTML=me?`👤 ${esc(names[me]||'')} <button id="chName">✎</button>`:`<button id="chName">${t('setName')}</button>`;$('#chName').onclick=askName}
}
$('#xlOut').onclick=exportXlsx;
$('#xlIn').onchange=e=>{const f=e.target.files[0];e.target.value='';handleFile(f)};

render();
(async()=>{
 try{user=await claude.use('user')}catch{}
 if(user){try{me=await user.id()}catch{}
  if(me)whoName(me).then(n=>{$('#who').textContent='👤 '+n});
  try{const w=await user.can('data.write');if(w===false){readOnly=true;banner('noPerm')}}catch{}}
 try{db=await claude.use('db')}catch{}
 if(db){mode='cloud';render();subscribe();return}
 // Excel mode: GitHub Pages, a downloaded copy, or any view without the claude.ai database
 mode='local';user=null;me=null;readOnly=false;bannerKey='';
 const store=loadStore();db=makeLocalDb(store);Object.assign(names,store.users||{});
 banner(storeHasData(store)?'localInfo':'localEmpty');
 subscribe();setupLocalMe();
 const got=await loadServerXlsx(false);
 if(!got&&!storeHasData(db.store))banner('localEmpty');
})();
</script>
